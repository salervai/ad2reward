<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ad2Reward - Viral Hub</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="11748430"
  ></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #111827;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #1677ff, #6c4cff);
      color: #fff;
      padding: 24px 18px;
      border-radius: 0 0 26px 26px;
    }

    .header h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .header p {
      font-size: 14px;
      opacity: .92;
      line-height: 1.5;
    }

    .container {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .video-card {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }

    .thumbnail {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: #ddd;
    }

    .video-info {
      padding: 16px;
    }

    .badge {
      display: inline-block;
      background: #eef4ff;
      color: #1677ff;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .video-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .video-description {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .unlock-btn {
      width: 100%;
      border: 0;
      padding: 14px;
      border-radius: 12px;
      background: #1677ff;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .unlock-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .unlock-btn:active {
      transform: scale(.98);
    }

    .progress-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .progress-text {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .progress-bg {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #1677ff;
      transition: width .3s ease;
    }

    .status-box {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .success-box {
      background: #ecfdf5;
      color: #047857;
    }

    .error-box {
      background: #fef2f2;
      color: #b91c1c;
    }

    .info-box {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      padding: 10px 0 25px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🔥 Ad2Reward</h1>

    <p>
      Rewarded বিজ্ঞাপন দেখে Trending ভিডিও আনলক করুন
    </p>
  </div>

  <div class="container">

    <div class="section-title">
      🎬 আজকের Viral Videos
    </div>

    <div class="video-card">

      <img
        class="thumbnail"
        src="https://placehold.co/800x450/png?text=Viral+Video"
        alt="Viral Video"
      >

      <div class="video-info">

        <div class="badge">
          🔒 Ad Watch Required
        </div>

        <div class="video-title">
          🔥 Trending Viral Video
        </div>

        <div class="video-description">
          ভিডিওটি দেখতে আগে ৩টি Rewarded বিজ্ঞাপন
          সম্পূর্ণভাবে দেখতে হবে। বিজ্ঞাপন সম্পূর্ণ হলে
          ভিডিও আনলক করার পরবর্তী ধাপ দেখানো হবে।
        </div>

        <button
          id="unlockBtn"
          class="unlock-btn"
          onclick="startUnlock()"
        >
          🔓 ভিডিও আনলক করুন
        </button>

        <div
          id="progressBox"
          class="progress-box"
        >

          <div
            id="progressText"
            class="progress-text"
          >
            বিজ্ঞাপন: 0 / 3
          </div>

          <div class="progress-bg">

            <div
              id="progressBar"
              class="progress-bar"
            ></div>

          </div>

        </div>

        <div
          id="infoBox"
          class="status-box info-box"
        ></div>

      </div>

    </div>

  </div>

  <div class="footer">
    🔥 Ad2Reward
  </div>


  <script>

    /*
      =========================================
      Ad2Reward - Monetag Rewarded Interstitial
      =========================================
    */

    const TOTAL_ADS = 3;
    const ZONE_ID = "11748430";

    let adsWatched = 0;
    let isWatching = false;
    let adReady = false;
    let currentYmid = null;


    /*
      Telegram WebApp initialization
    */

    if (
      window.Telegram &&
      Telegram.WebApp
    ) {

      Telegram.WebApp.ready();

      try {
        Telegram.WebApp.expand();
      } catch (e) {
        console.log("Telegram expand unavailable");
      }

    }


    /*
      DOM elements
    */

    const unlockBtn =
      document.getElementById("unlockBtn");

    const progressBox =
      document.getElementById("progressBox");

    const progressText =
      document.getElementById("progressText");

    const progressBar =
      document.getElementById("progressBar");

    const infoBox =
      document.getElementById("infoBox");


    /*
      Status message
    */

    function showInfo(
      message,
      type = "info"
    ) {

      infoBox.style.display = "block";

      if (type === "error") {

        infoBox.className =
          "status-box error-box";

      } else if (type === "success") {

        infoBox.className =
          "status-box success-box";

      } else {

        infoBox.className =
          "status-box info-box";

      }

      infoBox.textContent = message;

    }


    /*
      Progress update
    */

    function updateProgress() {

      progressBox.style.display = "block";

      progressText.textContent =
        "বিজ্ঞাপন: " +
        adsWatched +
        " / " +
        TOTAL_ADS;

      progressBar.style.width =
        (
          adsWatched /
          TOTAL_ADS *
          100
        ) + "%";

    }


    /*
      Wait until Monetag SDK is available
    */

    function waitForMonetag() {

      return new Promise(
        function(resolve, reject) {

          let attempts = 0;

          const timer =
            setInterval(
              function() {

                if (
                  typeof window[
                    "show_" + ZONE_ID
                  ] === "function"
                ) {

                  clearInterval(timer);

                  resolve();

                  return;
                }


                attempts++;


                if (attempts >= 50) {

                  clearInterval(timer);

                  reject(
                    new Error(
                      "Monetag SDK load হয়নি"
                    )
                  );

                }

              },
              200
            );

        }
      );

    }


    /*
      Preload Rewarded Ad
    */

    async function preloadAd() {

      try {

        await waitForMonetag();

        currentYmid =
          "ad2reward-" +
          Date.now();

        showInfo(
          "⏳ বিজ্ঞাপন প্রস্তুত হচ্ছে..."
        );

        await window[
          "show_" + ZONE_ID
        ]({

          type: "preload",

          ymid: currentYmid

        });


        adReady = true;

        showInfo(
          "✅ বিজ্ঞাপন প্রস্তুত। আনলক করতে চাপুন।"
        );

        unlockBtn.disabled = false;


      } catch (error) {

        console.error(
          "Preload error:",
          error
        );

        adReady = false;

        unlockBtn.disabled = false;

        showInfo(
          "বিজ্ঞাপন এখনো প্রস্তুত হয়নি। আবার চেষ্টা করুন।"
        );

      }

    }


    /*
      Show Rewarded Ad
    */

    async function startUnlock() {

      if (isWatching) {
        return;
      }


      if (adsWatched >= TOTAL_ADS) {
        return;
      }


      isWatching = true;

      unlockBtn.disabled = true;


      try {

        await waitForMonetag();


        /*
          If an ad was not preloaded,
          prepare one now.
        */

        if (!adReady) {

          showInfo(
            "⏳ বিজ্ঞাপন প্রস্তুত হচ্ছে..."
          );

          currentYmid =
            "ad2reward-" +
            Date.now();

          await window[
            "show_" + ZONE_ID
          ]({

            type: "preload",

            ymid: currentYmid

          });

          adReady = true;

        }


        showInfo(
          "🎬 বিজ্ঞাপন " +
          (adsWatched + 1) +
          " / " +
          TOTAL_ADS +
          " শুরু হচ্ছে..."
        );


        /*
          Show the actual rewarded ad
        */

        await window[
          "show_" + ZONE_ID
        ]({

          ymid: currentYmid

        });


        /*
          IMPORTANT:
          Only count the ad after the
          Monetag Promise resolves.
        */

        adsWatched++;

        updateProgress();


        /*
          Reset preload state
        */

        adReady = false;

        currentYmid = null;


        /*
          More ads required
        */

        if (
          adsWatched < TOTAL_ADS
        ) {

          showInfo(
            "✅ বিজ্ঞাপন সম্পূর্ণ হয়েছে। " +
            "আরও " +
            (
              TOTAL_ADS -
              adsWatched
            ) +
            "টি বিজ্ঞাপন বাকি।"
          );

          unlockBtn.disabled = false;


          /*
            Preload the next ad
          */

          setTimeout(
            function() {
              preloadAd();
            },
            500
          );

        }


        /*
          All ads completed
        */

        else {

          showInfo(
            "🎉 ৩টি Rewarded বিজ্ঞাপন সম্পূর্ণ হয়েছে!",
            "success"
          );

          unlockBtn.textContent =
            "✅ বিজ্ঞাপন সম্পূর্ণ";

          unlockBtn.disabled = true;

          /*
            Production version:
            এখানে backend verification
            করে তারপর real video unlock
            করা হবে।
          */

        }


      } catch (error) {

        console.error(
          "Monetag Rewarded Error:",
          error
        );


        adReady = false;

        currentYmid = null;


        showInfo(
          "⚠️ বিজ্ঞাপন সম্পূর্ণ হয়নি। আবার চেষ্টা করুন।",
          "error"
        );


        unlockBtn.disabled = false;


      } finally {

        isWatching = false;

      }

    }


    /*
      Start preload after page is ready
    */

    window.addEventListener(
      "load",
      function() {

        setTimeout(
          function() {

            preloadAd();

          },
          800
        );

      }
    );

  </script>

</body>
</html>
