<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viral Hub</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag Ad Tag -->
  <script src="//libtl.com/sdk.js" data-zone="11748430"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #111827;
    }

    .header {
      background: linear-gradient(135deg, #1677ff, #6c4cff);
      color: white;
      padding: 22px 18px;
      border-radius: 0 0 24px 24px;
    }

    .header h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      padding: 18px;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .video-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .thumbnail {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: #ddd;
    }

    .video-info {
      padding: 15px;
    }

    .badge {
      display: inline-block;
      background: #eef4ff;
      color: #1677ff;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .video-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .video-description {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .unlock-btn {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 12px;
      background: #1677ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .unlock-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .unlock-btn:active {
      transform: scale(0.98);
    }

    .progress-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 12px;
    }

    .progress-text {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .progress-bg {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #1677ff;
      transition: width 0.3s ease;
    }

    .success-box {
      display: none;
      margin-top: 15px;
      padding: 14px;
      background: #ecfdf5;
      color: #047857;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🔥 Viral Hub</h1>
    <p>Trending videos দেখতে নিচের ভিডিওটি নির্বাচন করুন</p>
  </div>

  <div class="container">

    <div class="section-title">
      🎬 আজকের Viral Videos
    </div>

    <div class="video-card">

      <img
        class="thumbnail"
        src="https://placehold.co/800x450/png?text=Viral+Video"
        alt="Viral Video"
      >

      <div class="video-info">

        <div class="badge">
          🔒 Ad Watch Required
        </div>

        <div class="video-title">
          🔥 Trending Viral Video
        </div>

        <div class="video-description">
          ভিডিওটি দেখতে প্রথমে ৩টি Rewarded বিজ্ঞাপন সম্পূর্ণভাবে দেখতে হবে।
        </div>

        <button
          class="unlock-btn"
          onclick="startUnlock()"
        >
          🔓 ভিডিও আনলক করুন
        </button>

        <div class="progress-box" id="progressBox">

          <div
            class="progress-text"
            id="progressText"
          >
            বিজ্ঞাপন: 0 / 3
          </div>

          <div class="progress-bg">
            <div
              class="progress-bar"
              id="progressBar"
            ></div>
          </div>

        </div>

        <div
          class="success-box"
          id="successBox"
        >
          🎉 ৩টি বিজ্ঞাপন সম্পূর্ণ হয়েছে!
        </div>

      </div>
    </div>
  </div>


  <script>

    /* Telegram */
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /* Unlock Settings */
    let adsWatched = 0;

    const requiredAds = 3;


    /* Start / Watch Ad */
    async function startUnlock() {

      const btn = document.querySelector(".unlock-btn");

      const progressBox =
        document.getElementById("progressBox");

      const progressText =
        document.getElementById("progressText");

      progressBox.style.display = "block";


      /* Already completed */
      if (adsWatched >= requiredAds) {
        return;
      }


      /* Disable button while ad is running */
      btn.disabled = true;

      btn.innerText =
        "⏳ বিজ্ঞাপন " +
        (adsWatched + 1) +
        "/" +
        requiredAds +
        " চলছে...";


      try {

        /* Check Monetag function */
        if (typeof show_11748430 !== "function") {

          throw new Error(
            "Monetag Rewarded Ad function পাওয়া যায়নি"
          );

        }


        /*
         * Monetag Rewarded Interstitial
         *
         * Ad completion হলে Promise resolve হবে
         */
        await show_11748430();


        /* Count completed ad */
        adsWatched++;


        /* Update progress */
        updateProgress();


        /* More ads required */
        if (adsWatched < requiredAds) {

          btn.disabled = false;

          btn.innerText =
            "▶️ বিজ্ঞাপন " +
            (adsWatched + 1) +
            "/" +
            requiredAds +
            " দেখুন";

        }


        /* All ads completed */
        else {

          btn.disabled = true;

          btn.innerText =
            "✅ ৩টি বিজ্ঞাপন সম্পূর্ণ";

          document.getElementById(
            "successBox"
          ).style.display = "block";

          alert(
            "🎉 অভিনন্দন!\n\n" +
            "৩টি Rewarded বিজ্ঞাপন সম্পূর্ণ হয়েছে।"
          );

        }

      }


      catch (error) {

        console.log(
          "Rewarded Ad Error:",
          error
        );


        btn.disabled = false;

        btn.innerText =
          "🔄 আবার বিজ্ঞাপন দেখুন";


        alert(
          "⚠️ বিজ্ঞাপন সম্পূর্ণ হয়নি।\n\n" +
          "আবার চেষ্টা করুন।"
        );

      }

    }


    /* Progress Update */
    function updateProgress() {

      const percent =
        (adsWatched / requiredAds) * 100;


      document.getElementById(
        "progressBar"
      ).style.width =
        percent + "%";


      document.getElementById(
        "progressText"
      ).innerText =
        "বিজ্ঞাপন: " +
        adsWatched +
        " / " +
        requiredAds;

    }

  </script>

</body>
</html>
